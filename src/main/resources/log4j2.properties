status = warn

appender.console.type = Console
appender.console.name = STDOUT
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5p [%c] - %m%n

rootLogger.level = info
rootLogger.appenderRefs = stdout
rootLogger.appenderRef.stdout.ref = STDOUT

logger.sql.name = org.hibernate.SQL
logger.sql.level = debug

logger.bind.name = org.hibernate.orm.jdbc.bind
logger.bind.level = trace

logger.extract.name = org.hibernate.orm.jdbc.extract
logger.extract.level = trace